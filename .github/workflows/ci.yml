name: Switcheroo checks

on:
  push:
    branches:
      - richard-patches
  pull_request:
    branches:
      - richard-patches

permissions:
  contents: read

concurrency:
  group: switcheroo-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Test release tooling
        run: python3 scripts/release/ReleaseTests.py
      - name: Test app
        run: bash ai/test.sh
